<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta name="viewport" content="width=device-width, user-scalable=1, initial-scale=1.0, minimum-scale=1.0">
        <title>Battrochtek</title>
        <meta name="description" content="Battrochtek drum machine and pattern sequencer.">
        <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
        <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
        <link rel="manifest" href="manifest.webmanifest">
        <meta name="msapplication-TileColor" content="#111a23">
        <meta name="theme-color" content="#111a23">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-title" content="Battrochtek">
        <meta property="og:url" content="./">
        <meta property="og:type" content="website">
        <meta property="og:title" content="Battrochtek">
        <meta property="og:description" content="Battrochtek drum machine and pattern sequencer.">
        <meta property="og:image" content="logo.png">
        <meta name="HandheldFriendly" content="true">
        <meta name="format-detection" content="telephone=no">
                <link rel="stylesheet" href="styles.css">

        </head>
    <body class="limited-ads">
        <div id="nav-back" class="drum-games-shade"></div>
        <div class="drum-machine-container" id="Drum-Machine-Online-Sequencer">
            <header>
                <div class="bt-header" aria-label="Battrochtek">
                    <h1><img src="logo.png" alt="" class="bt-header-logo"> <span>Battrochtek</span></h1>
                                    <div class="vu-meter-wrap" title="Niveau de sortie audio"><span class="vu-label">OUTPUT</span><div id="vu-meter" class="vu-meter" aria-label="VU-mètre de sortie"></div></div>
                </div>
            </header>
            <div class="bt">
                <div class="bt-head">
                    <p>
                        <strong>DRUM SEQUENCER</strong>
                    </p>
                </div>
                <div class="bt-left">
                    <div class="bt-corner"></div>
                </div>
                <div class="bt-toolbar" id="sets"></div>
                <div class="drum-machine-clear"></div>
                <div class="bt-leds" id="leds"></div>
                <div class="bt-left" id="tracks"></div>
                <div class="bt-grid">
                    <div class="grid"></div>
                </div>
                <div class="bt-right" id="sliders"></div>
                <div class="drum-machine-clear"></div>
                <div class="bt-left">
                    <div class="bt-line sounds">SCORE</div>
                </div>
                <div class="bt-toolbar">
                    <div class="bt-button" id="clear" title="Clear the current pattern">
                        <p>CLEAR</p>
                    </div>
                    <div class="bt-spacer"></div>
                    <div class="bt-button signature-control" id="signature-button" title="Signature : numérateur / dénominateur">
                        <div id="signature" class="signature-editor">
                            <select id="signature-numerator" aria-label="Numérateur de signature"><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select><span>/</span><select id="signature-denominator" aria-label="Dénominateur de signature"><option value="4" selected>4</option><option value="8">8</option><option value="16">16</option></select>
                        </div>
                    </div>
                    <div class="bt-button" id="metronome-button" title="Toggle metronome options and playback">
                        <div class="bt-label center">
                            <span3>OPTIONS</span3>
                        </div>
                        <p>METRO</p>
                    </div>
                    <div class="bt-spacer"></div>
                    <div class="bt-button large" id="play-button" title="Play or pause the sequence">
                        <div id="play-pause-icon" class="metronome-play"></div>
                    </div>
                    <div id="metronome-tempo-display">
                        <div id="metronome-tempo">120</div>
                        <div id="metronome-bpm">bpm</div>
                    </div>
                    <div class="bt-button small" id="minus-button" title="Decrease tempo">
                        <span1>-</span1>
                    </div>
                    <div class="bt-button small" id="plus-button" title="Increase tempo">
                        <span1>+</span1>
                    </div>
                    <div class="bt-button tap" id="tap-tempo" title="Tap tempo : clique plusieurs fois au rythme voulu">
                        <p>TAP</p>
                    </div>
                    <div class="bt-spacer transport-spacer"></div>
                    <div class="preset-selector" id="preset-selector" aria-label="Sélection des grooves">
                        <label class="preset-field"><span>FAMILY</span><select id="preset-family" title="Famille de groove"></select></label>
                        <label class="preset-field groove"><span>GROOVE</span><select id="preset-groove" title="Groove"></select></label>
                        <div class="bt-button preset-icon" id="groove-refresh" title="Recharger le groove original (tempo, swing, signature et pattern)" aria-label="Recharger le groove original"><span aria-hidden="true">↻</span></div>
                        <div class="bt-button preset-icon" id="random" title="Créer une variation musicale du groove courant" aria-label="Créer une variation"><span aria-hidden="true">⤨</span></div>
                    </div>

                </div>
                <div class="drum-machine-clear"></div>
                <div class="bt-left">
                    <div class="bt-line sounds">MEMORY</div>
                </div>
                <div class="bt-toolbar" id="memory">
                    <div class="bt-button" id="save" title="Save the current pattern in memory">
                        <p>SAVE</p>
                    </div>
                    <div class="bt-button" id="copy-paste" title="Copy or paste the selected pattern">
                        <p>COPY</p>
                    </div>
                    <div class="bt-button" id="chain" title="Chaîner les slots mémoire sauvegardés">
                        <p>CHAIN</p>
                    </div>
                    <div class="bt-spacer"></div>
                </div>
                <div class="drum-machine-clear"></div>
                <div class="bottom-controls">
                    <div class="bottom-control swing-control">
                        <div class="bt-line sounds">SWING <output id="swing-value" class="swing-value" for="swing">0%</output></div>
                        <div class="bt-sliders bt-swing" id="swing"></div>
                    </div>
                    <div class="bottom-control master-control-block">
                        <div class="bt-line sounds">MASTER</div>
                        <div class="bt-sliders" id="master"></div>
                    </div>
                </div>
                <div class="drum-machine-clear"></div>
            </div>
            <div class="bt-help" id="bt-help" aria-live="polite">
                <span class="bt-help-icon">💡</span>
                <span class="bt-help-text">Survole un bouton pour voir l’aide.</span>
            </div>
        </div>
        <script>
            var scriptLoaded = false;
            function loadJS(url) {
                const script = document.createElement('script');
                script.type = 'text/javascript';
                script.async = false;
                script.defer = true;
                script.src = url;
                document.head.appendChild(script);
            }
            function loadScript() {
                var width = document.documentElement.clientWidth || document.body.clientWidth || window.innerWidth;
                if (width >= 680 && scriptLoaded == false) {
                    loadJS('app.js');
                    scriptLoaded = true;
                }
            }
            window.onresize = function() {
                loadScript();
            };
            loadScript();

            (function() {
                var helpBar = document.getElementById('bt-help');
                if (!helpBar) return;

                var helpText = helpBar.querySelector('.bt-help-text');
                var defaultText = 'Survole un bouton pour voir l’aide.';

                function setHelp(text) {
                    helpText.textContent = text || defaultText;
                }

                document.addEventListener('mouseover', function(event) {
                    var button = event.target.closest('.bt-button[title]');
                    if (button) setHelp(button.getAttribute('title'));
                });

                document.addEventListener('mouseout', function(event) {
                    var button = event.target.closest('.bt-button[title]');
                    var related = event.relatedTarget && event.relatedTarget.closest ? event.relatedTarget.closest('.bt-button[title]') : null;
                    if (button && button !== related) setHelp();
                });

                document.addEventListener('focusin', function(event) {
                    var button = event.target.closest('.bt-button[title]');
                    if (button) setHelp(button.getAttribute('title'));
                });

                document.addEventListener('focusout', function(event) {
                    var button = event.target.closest('.bt-button[title]');
                    if (button) setHelp();
                });
            })();
        </script>
        <script>
            if ("serviceWorker" in navigator && location.protocol !== "file:") {
                window.addEventListener("load", function () {
                    navigator.serviceWorker.register("service-worker.js").catch(function (error) {
                        console.warn("Service worker non enregistré :", error);
                    });
                });
            }
        </script>
    </body>
</html>
